services:
# NAVIDOMRE BELOW
  navidrome:
    container_name: Navidrome
    image: deluan/navidrome:latest
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info  
      ND_BASEURL: ENV_BASE_URL
      ND_ENABLETRANSCODINGCONFIG: true 

    #Downloads and Sharing - Playlists
      ND_ENABLEDOWNLOADS: true
      ND_ENABLESHARING: true
      ND_UIWELCOMEMESSAGE: ENV_WELCOME_MESSAGE
    # Playlist Path
      ND_AUTOIMPORTPLAYLISTS: true
      ND_SMARTPLAYLISTREFRESHDELAY: "300s"
      ND_COVERARTPRIORITY: "embedded, cover.*, folder.*, front.*, external"

    #Plugins  
      ND_PLUGINS_ENABLED: false

    # Telemetry. - THESE NEED TO BE TRUE TO ENABLE LASTFM , LISTENBRAINZ, AND SPTOIFY INTEGRATIONS
      ND_ENABLEINSIGHTSCOLLECTOR: true
      ND_ENABLEEXTERNALSERVICES: true

    # Using a local scrober as a docker in koito.
      ND_LISTENBRAINZ_ENABLED: true
      ND_LISTENBRAINZ_BASEURL: ENV_LB_URL
      ND_LISTENBRAINZ_TOKEN: ENV_LB_TOKEN 
    # LastFM API info - For Scrobe!
      ND_LASTFM_ENABLED: true
      ND_LASTFM_LANGUAGE: "en"
      ND_LASTFM_APIKEY: ENV_LASTFM_API
      ND_LASTFM_SECRET: ENV_LASTFM_SECRET

    restart: unless-stopped    
    # Data and Config files stored on NFS Share is mounted into a PROD folder
    volumes:
      - /mnt/Docker/Navidrome:/data
      - /mnt/Media/iTunes/Music:/music:ro

networks:
  default:
    external: true
    name: music